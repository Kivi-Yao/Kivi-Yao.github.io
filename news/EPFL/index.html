  <!-- Theme toggle: runs immediately (not on DOMContentLoaded) so the button and the
       saved mode apply even while slow third-party scripts are still loading -->
  <script>
  (function () {
    const transition = () => {
      document.documentElement.classList.add('mode-transition');
      window.setTimeout(() => {
        document.documentElement.classList.remove('mode-transition');
      }, 500);
    };

    // ❄️ Snow mode is a WHITE ALBUM 2 easter egg: light styling with a
    // random WA2 scene behind a translucent veil, re-rolled every visit.
    const SNOW_BGS = [
      '/assets/img/snow-bg/snow-1.jpg',
      '/assets/img/snow-bg/snow-2.jpg',
      '/assets/img/snow-bg/snow-3.jpg'
    ];
    const MODE_ICON = { light: '☀️', dark: '🌙', snow: '❄️' };
    let currentMode = 'dark';

    const toggle = document.createElement('button');
    toggle.id = 'mode-toggle';
    toggle.title = '切换主题 ☀️→🌙→❄️';

    const setMode = (mode, animate) => {
      if (animate) transition();
      currentMode = mode;
      // Snow rides on light-mode styling so every light rule applies;
      // snow-mode itself only swaps the page background.
      document.body.classList.toggle('light-mode', mode === 'light' || mode === 'snow');
      document.body.classList.toggle('snow-mode', mode === 'snow');
      if (mode === 'snow') {
        const bg = SNOW_BGS[Math.floor(Math.random() * SNOW_BGS.length)];
        document.body.style.setProperty('--snow-bg', 'url(' + bg + ')');
      }
      toggle.textContent = MODE_ICON[mode];
      try { localStorage.setItem('mode', mode); } catch (e) { /* private mode */ }
    };

    toggle.addEventListener('click', () => {
      setMode(currentMode === 'light' ? 'dark' : currentMode === 'dark' ? 'snow' : 'light', true);
    });
    document.body.appendChild(toggle);

    // Step 1: Check localStorage first
    let saved = null;
    try { saved = localStorage.getItem('mode'); } catch (e) { /* private mode */ }
    if (saved === 'light' || saved === 'dark' || saved === 'snow') {
      setMode(saved, false);
    } else {
      // Step 2: Auto set based on local time
      const hour = new Date().getHours();
      setMode(hour >= 6 && hour < 18 ? 'light' : 'dark', false);
    }
  })();
  </script>

  <!-- Per-page setup: runs on first load and after every pjax swap -->
  <script type="text/javascript">
    function pageSetup() {
      var navbarHeight = $('#navbar').outerHeight(true);
      $('body').css({ 'padding-top': navbarHeight });
      $('progress-container').css({ 'padding-top': navbarHeight });
      var progressBar = $('#progress');
      progressBar.css({ 'top': navbarHeight });
      if ('max' in document.createElement('progress')) {
        progressBar.attr({ max: $(document).height() - $(window).height(), value: $(window).scrollTop() });
      }

      // Project cards masonry layout
      var $grid = $('#projects');
      if ($grid.length) {
        $grid.imagesLoaded().progress(function() {
          $grid.masonry({ percentPosition: true });
          $grid.masonry('layout');
        });
      }

      // Tooltips
      $('[data-toggle="tooltip"]').tooltip();

      // Syntax highlighting for pjax-swapped content (initial load is
      // covered by initHighlightingOnLoad; .hljs marks processed blocks)
      if (window.hljs) {
        $('.content pre code:not(.hljs)').each(function(i, block) { hljs.highlightBlock(block); });
      }

      // MathJax re-typeset for swapped content
      if (window.MathJax && MathJax.Hub) {
        MathJax.Hub.Queue(['Typeset', MathJax.Hub, document.querySelector('.content')]);
      }
    }

    $(document).ready(function() {
      var progressBar = $('#progress');
      var getMax = function() { return $(document).height() - $(window).height(); }
      var getValue = function() { return $(window).scrollTop(); }
      // Check if the browser supports the progress element.
      if ('max' in document.createElement('progress')) {
        $(document).on('scroll', function() {
          progressBar.attr({ value: getValue() });
        });
        $(window).resize(function() {
          var navbarHeight = $('#navbar').outerHeight(true);
          $('body').css({ 'padding-top': navbarHeight });
          $('progress-container').css({ 'padding-top': navbarHeight });
          progressBar.css({ 'top': navbarHeight });
          progressBar.attr({ max: getMax(), value: getValue() });
        });
      } else {
        var max = getMax(), value, width;
        var getWidth = function() {
          value = getValue();
          width = (value/max) * 100;
          return width + '%';
        }
        var setWidth = function() { progressBar.css({ width: getWidth() }); };
        setWidth();
        $(document).on('scroll', setWidth);
        $(window).on('resize', function() {
          max = getMax();
          setWidth();
        });
      }
      pageSetup();
    });

    document.addEventListener('pjax:done', function() {
      pageSetup();
      if (typeof gtag === 'function') {
        gtag('event', 'page_view', { page_location: location.href, page_title: document.title });
      }
    });
  </script>

  <!-- 💫 星空背景动效 -->
<script>
  const canvas = document.getElementById('star-canvas');
  const ctx = canvas.getContext('2d');
  let stars = [];
  
  function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();
  
  function createStars(count) {
      stars = [];
      for (let i = 0; i < count; i++) {
          stars.push({
              x: Math.random() * canvas.width,
              y: Math.random() * canvas.height,
              r: Math.random() * 1.5 + 0.5,
              speed: Math.random() * 0.2 + 0.05,
              opacity: Math.random(),
              flash: false
          });
      }
  }
  
  function drawStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let star of stars) {
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.r, 0, 2 * Math.PI);
          ctx.fillStyle = `rgba(255,255,255,${star.flash ? 1 : star.opacity})`;
          ctx.fill();
          star.y += star.speed;
          if (star.y > canvas.height) {
              star.y = 0;
              star.x = Math.random() * canvas.width;
          }
      }
  }
  
  function animate() {
      drawStars();
      requestAnimationFrame(animate);
  }
  createStars(250);
  animate();
  
  // 流星
  function shootMeteor() {
      let x = Math.random() * canvas.width;
      let y = 0;
      let length = 200;
      let angle = Math.PI / 4;
      let speed = 10;
      let alpha = 1;
  
      function drawMeteor() {
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.strokeStyle = 'rgba(255,255,255,0.8)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + length * Math.cos(angle), y + length * Math.sin(angle));
          ctx.stroke();
          ctx.restore();
      }
  
      function animateMeteor() {
          if (alpha <= 0) return;
          drawStars();
          drawMeteor();
          x += speed * Math.cos(angle);
          y += speed * Math.sin(angle);
          alpha -= 0.02;
          requestAnimationFrame(animateMeteor);
      }
  
      animateMeteor();
  }
  
  setInterval(() => {
      if (Math.random() < 0.3) {
          shootMeteor();
      }
  }, 5000);
  
  // 点击闪烁星星
  canvas.addEventListener('click', e => {
      const { offsetX, offsetY } = e;
      for (let star of stars) {
          const dx = star.x - offsetX;
          const dy = star.y - offsetY;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 40) {
              star.flash = true;
              setTimeout(() => (star.flash = false), 300);
          }
      }
  });
  </script>
