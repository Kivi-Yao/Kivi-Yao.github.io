# Data for the research overview diagram on the About page.
# The diagram itself is rendered by _includes/research_overview.html.
#
# To add a paper: append an item under the matching line's `papers` list.
#   - name: Paper name              (required)
#     venue: Venue label            (shown in brackets, e.g. ICLR'25 Spotlight)
#     url: https://...              (optional; makes the entry clickable)
#     note: extra remark            (optional; shown in parentheses)
# Set `more: true` on a line to show "more works to appear".

lines:
  - title: System-modeling co-design
    side: left
    row: top
    more: true
    papers:
      - name: D²SD
        venue: arXiv'26
        url: https://arxiv.org/abs/2606.04446
      - name: GRAPE
        venue: CS546 Project

  - title: Hardware-efficient algorithms
    side: left
    row: bottom
    papers:
      - name: DeFT
        venue: ICLR'25 Spotlight
        url: https://arxiv.org/abs/2404.00242

  - title: Agent applications
    side: right
    row: top
    papers:
      - name: ResearchTown
        venue: ICML'25
        url: https://arxiv.org/pdf/2412.17767

  - title: Application-customized hardware
    side: right
    row: bottom
    papers:
      - name: FPGA for Graph Sampling Acceleration
        venue: ZJU Outstanding Thesis
        note: my undergraduate project
